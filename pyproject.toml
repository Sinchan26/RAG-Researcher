[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-researcher"
version = "0.1.0"
description = "Agentic RAG research workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "streamlit>=1.40,<2",
  "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
